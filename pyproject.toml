[build-system]
requires = ["setuptools>=74", "wheel", "Cython>=3.1,<4", "numpy>=1.26", "scipy>=1.11,<1.18"]
build-backend = "setuptools.build_meta"

[project]
name = "mylpk"
version = "0.1.0"
description = "Cython revised-simplex LP/MILP engine and the myomo algebraic modeling interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11,<1.18"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "build>=1", "threadpoolctl>=3"]
glpk = ["swiglpk>=5.0"]
interop = ["highspy>=1.7", "pyomo>=6.8"]

[project.scripts]
mylpk = "mylpk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
